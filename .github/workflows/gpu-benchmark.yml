name: Manual GPU detector evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-gpu.txt
      - run: python -m pip install --no-deps -e .
      - run: python -c 'import torch; assert torch.cuda.is_available(), "CUDA not available on this runner"'
      - run: python scripts/download_assets.py --group sample
      - run: python scripts/benchmark.py --output-dir outputs/gpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'outputs/gpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detector-benchmark
          path: outputs/gpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*
